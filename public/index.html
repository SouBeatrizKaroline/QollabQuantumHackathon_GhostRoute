<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#051821">
  <meta name="description" content="Ghost Route — a pixel-art quantum navigation adventure by QuantGirls.">
  <title>Ghost Route — QuantGirls</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/ghost-route-mark.svg">
  <link rel="stylesheet" href="assets/css/game.css?v=4">
</head>
<body>
<div id="game-shell">
  <canvas id="map-canvas" role="img" aria-describedby="map-description"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="bezel" aria-hidden="true"></div>

  <header class="hud-top pixel-panel">
    <section class="signal">
      <div class="hud-label"><span data-i18n="signalLabel"></span><strong id="gps-status"></strong></div>
      <div class="meter"><div id="gps-meter"></div></div>
      <div class="mission-line"><span class="status-dot" aria-hidden="true"></span><span id="mission-badge"></span></div>
    </section>
    <div class="brand">
      <img class="brand-mark" src="assets/img/ghost-route-mark.svg" width="46" height="46" alt="" aria-hidden="true">
      <div class="brand-type"><h1 id="app-title">Ghost Route</h1><span class="brand-sub">QUANTGIRLS</span></div>
      <canvas id="title-canvas" width="364" height="58" hidden aria-hidden="true"></canvas>
    </div>
    <section class="energy">
      <div class="hud-label"><span id="lbl-budget"></span><strong id="val-budget"></strong></div>
      <div class="meter"><div id="budget-bar-fill"></div></div>
      <div class="mission-line hull"><span data-i18n="hullLabel"></span><strong id="hull-status"></strong></div>
    </section>
  </header>

  <nav class="utility" aria-label="Mission controls">
    <label for="lang-select" id="lbl-language" class="sr-only"></label>
    <select id="lang-select">
      <option value="pt-BR" label="BR" selected>BR · Português (Brasil)</option>
      <option value="pt-PT" label="PT">PT · Português (Portugal)</option>
      <option value="es" label="ES">ES · Español</option>
      <option value="en" label="IN">IN · English</option>
    </select>
    <button id="btn-fullscreen" type="button" data-i18n="fullscreen"></button>
    <button id="btn-restart" type="button"><span id="txt-restart"></span></button>
    <button id="btn-menu" class="menu-trigger" type="button" aria-controls="mission-menu" aria-haspopup="dialog"><span class="menu-icon" aria-hidden="true"></span><span data-i18n="menuLabel"></span></button>
  </nav>
  <div id="debug-badge" class="debug-badge"></div>

  <section class="compass-widget pixel-panel">
    <canvas id="compass-canvas" width="120" height="120" aria-hidden="true"></canvas><span id="val-heading"></span>
  </section>
  <section class="radar-widget pixel-panel">
    <span data-i18n="radarLabel"></span><canvas id="radar-canvas" width="132" height="112" aria-hidden="true"></canvas><small id="val-pos"></small>
  </section>
  <div class="telemetry-strip">
    <span><i id="lbl-turn"></i><strong id="val-turn"></strong></span>
    <span><i id="lbl-time"></i><strong id="val-time"></strong></span>
    <span><i id="lbl-dist"></i><strong id="val-dist"></strong></span>
  </div>
  <section class="radio-widget pixel-panel" aria-labelledby="heading-comms">
    <div class="panel-kicker"><h2 id="heading-comms"><span id="txt-radio-title"></span></h2><span class="radio-led" aria-hidden="true"></span><button id="btn-radio-toggle" class="radio-toggle" type="button" aria-expanded="false">▼</button></div>
    <div class="radio-body"><canvas id="avatar-canvas" width="48" height="48" aria-hidden="true"></canvas><div><strong id="speaker-name"></strong><span id="speaker-role"></span></div></div>
    <p id="dialogue-box"></p><div id="dialogue-nav"><button id="btn-next-tutorial" type="button" data-i18n="acknowledge"></button></div>
  </section>
  <section class="navigation-dock pixel-panel" aria-label="Navigation controls">
    <div class="warning-stack dock-notices" aria-live="assertive" aria-atomic="true"><div id="alert-gps" class="warning"></div><div id="alert-reef" class="warning"></div></div>
    <div class="dock-instruments">
    <div class="heading-module">
      <div class="panel-kicker"><h2 id="txt-helm-title"></h2><strong id="slider-val-display"></strong></div>
      <label id="lbl-slider-heading" for="heading-slider"></label><input id="heading-slider" type="range" min="0" max="359" value="45">
      <div class="compass-grid" role="group">
        <button class="btn-dir" type="button" data-deg="315">NW</button><button class="btn-dir" type="button" data-deg="0">N</button><button class="btn-dir" type="button" data-deg="45">NE</button><button class="btn-dir" type="button" data-deg="270">W</button><button class="btn-dir" type="button" data-deg="90">E</button><button class="btn-dir" type="button" data-deg="225">SW</button><button class="btn-dir" type="button" data-deg="180">S</button><button class="btn-dir" type="button" data-deg="135">SE</button>
      </div>
    </div>
    <div class="sensor-module">
      <div class="panel-kicker"><h2 data-i18n="sensorTitle"></h2><button id="btn-sensor-help" class="help-btn" type="button" aria-haspopup="dialog" aria-controls="sensor-intro"><span aria-hidden="true">?</span><span class="sr-only" data-i18n="sensorIntroHelp"></span></button><span class="qubit-pips" aria-hidden="true">▣ ▣ ▣</span></div>
      <div class="sensor-fields">
        <div><label id="lbl-sensor-mode" for="sensor-mode-select"></label><select id="sensor-mode-select"><option id="opt-mode-none" value="none"></option><option id="opt-mode-simple" value="simple" selected></option><option id="opt-mode-ghz" value="ghz"></option></select></div>
        <div><label id="lbl-sensor-shots" for="sensor-shots-select"></label><select id="sensor-shots-select"><option value="100">100</option><option value="250">250</option><option value="500" selected>500</option><option value="1000">1000</option></select></div>
      </div>
      <p id="last-reading"></p>
    </div>
    </div>
    <div class="action-module">
      <label class="suspicion-container"><input id="chk-suspicious" type="checkbox"><span id="lbl-suspicious"></span></label>
      <button id="btn-advance" class="sail-button" type="button"><span class="sail-icon" aria-hidden="true">▶</span><span id="txt-advance"></span><kbd data-i18n="enterKey"></kbd></button>
      <p id="txt-shortcut-hint"></p>
    </div>
  </section>
  <div class="chart-legend pixel-panel"><span id="legend-port"></span><span id="legend-ship"></span><span id="legend-gps" class="dash-key"></span><span id="legend-true" hidden></span><span id="legend-inertial" hidden></span><span id="legend-heat" class="heat-key"></span><span id="legend-reef" class="reef-key"></span></div>
  <div class="bottom-status"><span id="txt-grid-scale"></span><span class="credits"><span lang="en">This effort is supported by Qollab &amp; IonQ</span><span id="translated-credit"></span></span></div>
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div><p id="map-description" class="sr-only"></p>
  <div hidden><span id="txt-map-title"></span><span id="txt-telemetry-title"></span><span id="lbl-pos"></span><span id="lbl-heading"></span><span id="lbl-speed"></span><span id="val-speed"></span></div>
</div>


<div id="sensor-intro" class="sensor-intro" role="dialog" aria-modal="true" aria-labelledby="sensor-intro-title" hidden>
  <section class="sensor-intro-box pixel-panel">
    <div class="sensor-intro-head">
      <svg class="sensor-intro-atom" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke-width="2.5"><ellipse cx="24" cy="24" rx="20" ry="8" stroke="#b69cff"/><ellipse cx="24" cy="24" rx="20" ry="8" stroke="#d7c8ff" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="20" ry="8" stroke="#ffd166" transform="rotate(120 24 24)"/></g><circle cx="24" cy="24" r="4.5" fill="#ff8a3d"/></svg>
      <h2 id="sensor-intro-title" data-i18n="sensorIntroTitle"></h2>
    </div>
    <p data-i18n="sensorIntroGps"></p>
    <p data-i18n="sensorIntroQuantum"></p>
    <ul>
      <li data-i18n="sensorIntroMode"></li>
      <li data-i18n="sensorIntroShots"></li>
    </ul>
    <button id="btn-sensor-intro-ok" class="sensor-intro-ok" type="button" data-i18n="sensorIntroOk"></button>
  </section>
</div>
<div id="mission-menu" class="mission-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" aria-describedby="menu-intro" hidden>
  <section class="menu-box pixel-panel">
    <header class="menu-topbar"><span class="menu-eyebrow" data-i18n="menuEyebrow"></span><button id="btn-menu-close" type="button" data-i18n="menuClose"></button></header>
    <div class="menu-content">
      <div class="menu-hero">
        <div class="menu-emblem" aria-hidden="true"><img src="assets/img/ghost-route-mark.svg" width="120" height="120" alt=""><span class="emblem-cross north"></span><span class="emblem-cross east"></span><span class="emblem-cross south"></span><span class="emblem-cross west"></span></div>
        <p class="menu-brand-name" aria-hidden="true">GHOST<br> ROUTE<span class="brand-period">.</span></p>
        <p class="menu-brand-line" data-i18n="menuBrandLine"></p>
        <h2 id="menu-title" data-i18n="menuTitle"></h2>
        <p id="menu-intro" data-i18n="menuIntro"></p>
        <button id="btn-menu-primary" class="menu-primary" type="button"><span id="menu-primary-label" data-i18n="menuStart"></span><span aria-hidden="true">→</span></button>
        <p class="menu-keyboard" data-i18n="menuKeyboard"></p>
      </div>
      <div class="menu-console">
        <section class="campaign-card" aria-labelledby="menu-campaign-title">
          <div class="menu-section-heading"><h3 id="menu-campaign-title" data-i18n="menuCampaign"></h3><strong id="current-level">00</strong></div>
          <div class="campaign-selector"><div><label id="menu-level-label" for="level-select" data-i18n="menuLevel"></label><select id="level-select" aria-labelledby="menu-level-label"></select></div><div class="campaign-difficulty"><span data-i18n="menuDifficulty"></span><strong id="level-difficulty"></strong></div></div>
          <p id="level-description" class="level-description"></p>
          <div class="campaign-progress"><span data-i18n="menuProgress"></span><strong id="level-progress"></strong></div>
          <button id="btn-start-level" class="menu-level-action" type="button"><span data-i18n="menuStartLevel"></span><span aria-hidden="true">↗</span></button>
        </section>
        <section class="menu-settings" aria-labelledby="menu-settings-title">
          <h3 id="menu-settings-title" class="menu-section-label" data-i18n="menuSettings"></h3>
          <div class="menu-settings-row"><div><label for="menu-lang-select" data-i18n="menuLanguage"></label><select id="menu-lang-select"><option value="pt-BR" selected>BR · Português (Brasil)</option><option value="pt-PT">PT · Português (Portugal)</option><option value="es">ES · Español</option><option value="en">IN · English</option></select></div><button id="btn-sound" type="button" aria-pressed="false" data-i18n="soundOff"></button><button id="btn-menu-fullscreen" type="button" data-i18n="menuFullscreen"></button></div>
        </section>
        <details class="menu-guide">
          <summary data-i18n="menuGuide"></summary>
          <ol><li><strong data-i18n="menuGuideHeading"></strong><p data-i18n="menuGuideHeadingBody"></p></li><li><strong data-i18n="menuGuideSensor"></strong><p data-i18n="menuGuideSensorBody"></p></li><li><strong data-i18n="menuGuideAdvance"></strong><p data-i18n="menuGuideAdvanceBody"></p></li></ol>
        <div class="menu-secondary-actions"><button id="btn-menu-restart" type="button" data-i18n="menuRestart"></button><button id="btn-menu-export" type="button" data-i18n="menuExport"></button></div>
        </details>
      </div>
    </div>
    <footer class="menu-footer"><span class="menu-footer-code" aria-hidden="true">GR / PIXEL ART</span><span lang="en">This effort is supported by Qollab &amp; IonQ</span></footer>
  </section>
</div>

<div id="replay-modal" class="replay-modal" role="dialog" aria-modal="true" aria-labelledby="replay-title-text">
  <section class="replay-box pixel-panel">
    <div class="panel-kicker"><h2 id="replay-title-text"></h2><button id="btn-close-replay" type="button" data-i18n="close"></button></div>
    <p id="outcome-banner" class="outcome-banner"></p>
    <div class="scoreboard-grid"><div><span id="lbl-rep-score"></span><strong id="val-rep-score"></strong></div><div><span id="lbl-rep-false"></span><strong id="val-rep-false"></strong></div><div><span id="lbl-rep-dist"></span><strong id="val-rep-dist"></strong></div><div><span id="lbl-rep-shots"></span><strong id="val-rep-shots"></strong></div></div>
    <label id="lbl-scrubber" for="scrubber-range"></label><input id="scrubber-range" type="range" min="1" max="12" value="12">
    <div id="turn-event-info"></div><div id="attack-timeline"></div><p id="timeline-legend"></p>
    <div id="replay-measurement-box"><h3 id="lbl-meas-title"></h3><div id="meas-details"></div><canvas id="histogram-canvas" width="520" height="112" aria-hidden="true"></canvas><p id="histogram-caption" class="histogram-caption" data-i18n="histogramDescription"></p></div>
    <div class="replay-controls"><button id="btn-next-level" class="menu-level-action" type="button" data-i18n="nextLevel" hidden></button><button id="btn-replay-same" type="button"><span id="txt-btn-same"></span></button><button id="btn-replay-new" type="button"><span id="txt-btn-new"></span></button><button id="btn-export-json" type="button"><span id="txt-btn-export"></span></button></div>
  </section>
</div>
<div id="feature-intro" class="feature-intro" role="dialog" aria-modal="true" aria-labelledby="feature-title" aria-describedby="feature-body" hidden>
  <section class="feature-card"><span id="feature-step"></span><h2 id="feature-title"></h2><p id="feature-body"></p><button id="btn-feature-ok" type="button" data-i18n="acknowledge"></button></section>
</div>
<script src="assets/js/i18n.js?v=4"></script><script src="assets/js/engine.js?v=3"></script><script src="assets/js/audio.js?v=3"></script><script src="assets/js/onboarding.js?v=3"></script><script src="assets/js/app.js?v=4"></script><script src="assets/js/console-decor.js?v=3"></script>
</body>
</html>
