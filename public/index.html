<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06162a"><title>Ghost Route — QuantGirls</title><link rel="stylesheet" href="assets/css/game.css"></head><body>
<div id="game-shell">
 <canvas id="map-canvas" role="img" aria-describedby="map-description"></canvas><div class="scanlines" aria-hidden="true"></div><div class="bezel" aria-hidden="true"></div>
 <header class="hud-top pixel-panel">
  <section class="signal"><div class="hud-label"><span data-i18n="signalLabel"></span><strong id="gps-status"></strong></div><div class="meter"><div id="gps-meter"></div></div><div class="mission-line"><span class="status-dot"></span><span id="mission-badge"></span></div></section>
  <div class="brand"><h1 id="app-title" class="sr-only">Ghost Route</h1><canvas id="title-canvas" width="364" height="58" aria-hidden="true"></canvas><span class="brand-sub">SPOOFED / QUANTGIRLS</span></div>
  <section class="energy"><div class="hud-label"><span id="lbl-budget"></span><strong id="val-budget"></strong></div><div class="meter"><div id="budget-bar-fill"></div></div><div class="mission-line hull"><span data-i18n="hullLabel"></span><strong id="hull-status"></strong></div></section>
 </header>
 <nav class="utility" aria-label="Game settings"><label for="lang-select" id="lbl-language" class="sr-only"></label><select id="lang-select"><option value="en">ENGLISH</option><option value="pt-BR" selected>PORTUGUÊS</option><option value="es">ESPAÑOL</option></select><button id="btn-fullscreen" type="button" data-i18n="fullscreen"></button><button id="btn-restart" type="button"><span id="txt-restart"></span></button></nav>
 <div id="debug-badge" class="debug-badge"></div>
 <section class="compass-widget pixel-panel"><canvas id="compass-canvas" width="120" height="120" aria-hidden="true"></canvas><span id="val-heading"></span></section>
 <section class="radar-widget pixel-panel"><span data-i18n="radarLabel"></span><canvas id="radar-canvas" width="132" height="112" aria-hidden="true"></canvas><small id="val-pos"></small></section>
 <div class="telemetry-strip"><span><i id="lbl-turn"></i><strong id="val-turn"></strong></span><span><i id="lbl-time"></i><strong id="val-time"></strong></span><span><i id="lbl-dist"></i><strong id="val-dist"></strong></span></div>
 <section class="radio-widget pixel-panel" aria-labelledby="heading-comms"><div class="panel-kicker"><h2 id="heading-comms"><span id="txt-radio-title"></span></h2><span class="radio-led">●</span><button id="btn-radio-toggle" class="radio-toggle" type="button" aria-expanded="false">▼</button></div><div class="radio-body"><canvas id="avatar-canvas" width="48" height="48" aria-hidden="true"></canvas><div><strong id="speaker-name"></strong><span id="speaker-role"></span></div></div><p id="dialogue-box"></p><div id="dialogue-nav"><button id="btn-next-tutorial" data-i18n="acknowledge"></button></div></section>
 <div class="warning-stack" aria-live="assertive" aria-atomic="true"><div id="alert-gps" class="warning"></div><div id="alert-reef" class="warning"></div></div>
 <section class="navigation-dock pixel-panel" aria-label="Navigation controls">
  <div class="heading-module"><div class="panel-kicker"><h2 id="txt-helm-title"></h2><strong id="slider-val-display"></strong></div><label id="lbl-slider-heading" for="heading-slider"></label><input id="heading-slider" type="range" min="0" max="359" value="45"><div class="compass-grid" role="group"><button class="btn-dir" data-deg="315">NW</button><button class="btn-dir" data-deg="0">N</button><button class="btn-dir" data-deg="45">NE</button><button class="btn-dir" data-deg="270">W</button><button class="btn-dir" data-deg="90">E</button><button class="btn-dir" data-deg="225">SW</button><button class="btn-dir" data-deg="180">S</button><button class="btn-dir" data-deg="135">SE</button></div></div>
  <div class="sensor-module"><div class="panel-kicker"><h2 data-i18n="sensorTitle"></h2><span class="qubit-pips" aria-hidden="true">▣ ▣ ▣</span></div><div class="sensor-fields"><div><label id="lbl-sensor-mode" for="sensor-mode-select"></label><select id="sensor-mode-select"><option id="opt-mode-none" value="none"></option><option id="opt-mode-simple" value="simple" selected></option><option id="opt-mode-ghz" value="ghz"></option></select></div><div><label id="lbl-sensor-shots" for="sensor-shots-select"></label><select id="sensor-shots-select"><option value="100">100</option><option value="250">250</option><option value="500" selected>500</option><option value="1000">1000</option></select></div></div><p id="last-reading"></p></div>
  <div class="action-module"><label class="suspicion-container"><input id="chk-suspicious" type="checkbox"><span id="lbl-suspicious"></span></label><button id="btn-advance" class="sail-button"><span class="sail-icon" aria-hidden="true">▶</span><span id="txt-advance"></span><kbd data-i18n="enterKey"></kbd></button><p id="txt-shortcut-hint"></p></div>
 </section>
 <div class="chart-legend pixel-panel"><span id="legend-port"></span><span id="legend-ship"></span><span id="legend-gps" class="dash-key"></span><span id="legend-true" hidden></span><span id="legend-inertial" hidden></span><span id="legend-heat" class="heat-key"></span><span id="legend-reef" class="reef-key"></span></div>
 <div class="bottom-status"><span id="txt-grid-scale"></span><span class="credits"><span lang="en">This effort is supported by Qollab &amp; IonQ</span><span id="translated-credit"></span></span></div>
 <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div><p id="map-description" class="sr-only"></p>
 <div hidden><span id="txt-map-title"></span><span id="txt-telemetry-title"></span><span id="lbl-pos"></span><span id="lbl-heading"></span><span id="lbl-speed"></span><span id="val-speed"></span></div>
</div>
<div id="replay-modal" class="replay-modal" role="dialog" aria-modal="true" aria-labelledby="replay-title-text"><section class="replay-box pixel-panel"><div class="panel-kicker"><h2 id="replay-title-text"></h2><button id="btn-close-replay" data-i18n="close"></button></div><p id="outcome-banner" class="outcome-banner"></p><div class="scoreboard-grid"><div><span id="lbl-rep-score"></span><strong id="val-rep-score"></strong></div><div><span id="lbl-rep-false"></span><strong id="val-rep-false"></strong></div><div><span id="lbl-rep-dist"></span><strong id="val-rep-dist"></strong></div><div><span id="lbl-rep-shots"></span><strong id="val-rep-shots"></strong></div></div><label id="lbl-scrubber" for="scrubber-range"></label><input id="scrubber-range" type="range" min="1" max="12" value="12"><div id="turn-event-info"></div><div id="attack-timeline"></div><p id="timeline-legend"></p><div id="replay-measurement-box"><h3 id="lbl-meas-title"></h3><div id="meas-details"></div><canvas id="histogram-canvas" width="520" height="112" aria-hidden="true"></canvas></div><div class="replay-controls"><button id="btn-replay-same"><span id="txt-btn-same"></span></button><button id="btn-replay-new"><span id="txt-btn-new"></span></button><button id="btn-export-json"><span id="txt-btn-export"></span></button></div></section></div>
<script src="assets/js/i18n.js"></script><script src="assets/js/engine.js"></script><script src="assets/js/app.js"></script></body></html>
